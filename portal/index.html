<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A63A2B">
<title>我的学分 · 班主任工作台</title>
<!--
  学生查询端（v3.7.1）· 独立只读页 + 自助兑换申请
  规格见 ../SPEC_学生查询端.md（v3.7.0 基础）与 ../PROGRESS.md v3.7.1 章节。铁律：
  ① 外部零依赖零 CDN —— QR 生成器为同仓自带的 qrcode.js / qrcode_utf8.js（MIT，kazuhikoarase）；
  ② 只解密自己那一片，页面里不存在任何「解全部」的代码路径；
  ③ 加密参数必须与 ../index.html 完全一致（PBKDF2 30000 / SHA-256 / AES-GCM 256 /
     12 字节 IV / 密钥材料 = 去掉横线的大写码），不同步 = 全班当场解不开。守卫 _v370/_v371 会比对两端常量；
  ④ 兑换二维码 = 一次性「带签名的申请单」：HMAC-SHA256 密钥与查询分片同源派生，
     10 分钟时效 + 一次性 nonce，老师端验签后才入账——学生端永远不直接写账。
-->
<style>
  :root{
    --bg:#F6F2E9; --card:#FFFDF7; --ink:#2B2B33; --ink2:#5F5E5A; --ink3:#8C8577;
    --border:#E6DECD; --primary:#A63A2B; --up:#2F7D5B; --down:#B42318; --gold:#C08A2D;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191714; --card:#232019; --ink:#EDE8DD; --ink2:#B8B2A5; --ink3:#8C8577;
      --border:#3A352C; --primary:#D9705E; --up:#5FBF8E; --down:#E57373; --gold:#D9A94E;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.6; padding:0 16px 140px;
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%; max-width:460px; padding-top:28px}
  .brand{text-align:center; margin-bottom:22px}
  .brand h1{font-size:17px; font-weight:600; margin:0 0 4px; letter-spacing:.5px}
  .brand p{font-size:12px; color:var(--ink3); margin:0}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 18px 20px; margin-bottom:14px}
  label{display:block; font-size:12.5px; color:var(--ink2); margin-bottom:6px}
  input{width:100%; padding:12px 14px; font-size:16px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--ink); outline:none; font-family:inherit}
  input:focus{border-color:var(--primary)}
  input::placeholder{color:var(--ink3)}
  .field{margin-bottom:14px}
  #codeInput{letter-spacing:2px; text-transform:uppercase; font-variant-numeric:tabular-nums}
  button.go{width:100%; padding:13px; font-size:15.5px; font-weight:600; border:0; border-radius:12px; background:var(--primary); color:#fff; cursor:pointer; font-family:inherit; transition:opacity .15s}
  button.go:disabled{opacity:.55; cursor:default}
  button.go:active{opacity:.8}
  .msg{margin-top:12px; font-size:13px; line-height:1.7; border-radius:10px; padding:10px 12px; display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(180,35,24,.08); color:var(--down); border:1px solid rgba(180,35,24,.2)}
  .msg.warn{background:rgba(192,138,45,.1); color:#8a6410; border:1px solid rgba(192,138,45,.25)}
  /* v3.7.6 记住我 */
  .rmrow{display:flex;align-items:flex-start;gap:7px;margin:2px 0 12px;font-size:12px;color:var(--ink2);cursor:pointer}
  .rmrow input{width:auto;margin-top:3px;accent-color:var(--primary)}
  .rmrow b{font-weight:600}
  #rmBanner{display:none;background:rgba(166,58,43,.07);border:1px solid rgba(166,58,43,.22);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.9}
  .rmact{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:999px;background:var(--primary);color:#fff;cursor:pointer}
  .rmact.rmclear{background:transparent;color:var(--ink3);border:1px solid var(--border)}
  /* 结果区 */
  .hero{text-align:center; padding:22px 16px}
  .hero .nm{font-size:15px; color:var(--ink2); margin-bottom:10px}
  .hero .nm b{color:var(--ink); font-weight:600}
  .hero .score{font-size:56px; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:-1px}
  .hero .unit{font-size:14px; color:var(--ink3); margin-left:4px; font-weight:400}
  .hero .lv{display:inline-block; margin-top:10px; font-size:12px; padding:3px 12px; border-radius:999px; background:rgba(166,58,43,.09); color:var(--primary); border:1px solid rgba(166,58,43,.22)}
  .rankseal{display:inline-block; margin-top:10px; margin-left:6px; font-size:12px; padding:3px 12px; border-radius:10px; border:1.5px solid rgba(166,58,43,.45); background:rgba(166,58,43,.06); color:var(--primary); font-weight:600}
  .trend{display:flex; gap:10px; margin-top:16px}
  .trend div{flex:1; background:var(--bg); border-radius:12px; padding:10px 8px; text-align:center}
  .trend .k{font-size:11.5px; color:var(--ink3); display:block; margin-bottom:3px}
  .trend .v{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink3)}
  .coin-line{text-align:center; font-size:12.5px; color:var(--ink3); margin-top:14px}
  .coin-line b{color:var(--primary); font-size:15px; font-weight:600}
  /* 流水 */
  .sec-title{font-size:13px; font-weight:600; color:var(--ink2); margin:20px 2px 10px; display:flex; justify-content:space-between; align-items:baseline}
  .sec-title span{font-size:11.5px; font-weight:400; color:var(--ink3)}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px}
  .chip{font-size:12px; padding:5px 13px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--ink2); cursor:pointer; user-select:none}
  .chip:active{transform:scale(.96)}
  .chip.on{background:var(--primary); border-color:var(--primary); color:#fff}
  .chip .n{font-size:10.5px; opacity:.75; margin-left:2px}
  .day{font-size:11.5px; color:var(--ink3); margin:14px 2px 6px}
  .row{display:flex; align-items:center; gap:10px; padding:11px 12px; background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:7px}
  .row .amt{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; min-width:44px; text-align:right; flex:none}
  .row .rs{flex:1; min-width:0; font-size:13.5px; color:var(--ink); word-break:break-word}
  .row .tm{font-size:11.5px; color:var(--ink3); flex:none}
  .opsum{padding:9px 12px; font-size:11.5px; color:var(--ink3); background:var(--card); border:1px dashed var(--border); border-radius:10px; display:flex; justify-content:space-between; margin-bottom:7px}
  .empty{text-align:center; padding:26px 10px; color:var(--ink3); font-size:13px}
  /* 商品 */
  .goods{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .good{background:var(--card); border:1px solid var(--border); border-radius:13px; padding:13px 12px; display:flex; flex-direction:column; gap:5px; position:relative}
  .good .gi{font-size:22px; line-height:1}
  .good .gn{font-size:13.5px; font-weight:600}
  .good .gc{font-size:11px; color:var(--ink3)}
  .good .gp{font-size:13px; color:var(--ink2); flex:1}
  .good .gp b{font-size:17px; color:var(--primary); font-weight:700}
  .good.dim{opacity:.5}
  .addbtn{align-self:flex-end; border:1.5px solid rgba(166,58,43,.4); color:var(--primary); background:rgba(166,58,43,.05); border-radius:9px; font-size:12px; padding:5px 12px; cursor:pointer; font-weight:600; font-family:inherit}
  .addbtn:active{transform:scale(.94)}
  .addbtn[disabled]{border-color:var(--border); color:var(--ink3); background:transparent}
  .cardqty{align-self:flex-end;display:flex;align-items:center;gap:8px}
  .cardqty i{font-style:normal;width:26px;height:26px;border:1px solid var(--border);border-radius:8px;display:grid;place-items:center;cursor:pointer;font-size:14px;color:var(--ink2);user-select:none}
  .cardqty i[disabled]{opacity:.3}
  .cardqty b{font-size:14px;min-width:14px;text-align:center}
  .incart{position:absolute; top:9px; right:9px; background:var(--primary); color:#fff; font-size:10px; border-radius:999px; padding:1px 7px; display:none}
  /* 购物车浮条 */
  .cartbar{position:fixed; left:50%; transform:translateX(-50%); bottom:14px; width:min(430px,calc(100vw - 24px)); background:#2B2B33; color:#F5EFE2; border-radius:15px; padding:12px 16px; display:none; align-items:center; gap:10px; box-shadow:0 10px 30px rgba(20,17,12,.35); z-index:50; cursor:pointer}
  .cartbar .ci{flex:1; font-size:13px}
  .cartbar .ci b{color:#E8B96A; font-size:16px; font-weight:700}
  .cartbar .ci .lack{color:#F0917E; font-size:11.5px; display:block}
  .cartbar button{border:0; border-radius:10px; padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer; background:var(--primary); color:#fff; font-family:inherit}
  .cartbar button[disabled]{opacity:.4}
  /* 清单抽屉 */
  .sheetmask{position:fixed; inset:0; background:rgba(30,26,20,.45); z-index:60; display:none}
  .sheet{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(460px,100vw); background:var(--card); border-radius:18px 18px 0 0; padding:18px 18px 26px; z-index:61; display:none; max-height:82vh; overflow-y:auto}
  .sheet h3{font-size:16px; margin:0 0 4px}
  .sheet .sub{font-size:11.5px; color:var(--ink3); margin-bottom:12px}
  .crow{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px dashed var(--border)}
  .crow .cn{flex:1; min-width:0}
  .crow .cn b{font-size:14px}
  .crow .cn span{display:block; font-size:11px; color:var(--ink3)}
  .crow .qty{display:flex; align-items:center; gap:9px}
  .crow .qty i{font-style:normal; width:27px; height:27px; border:1px solid var(--border); border-radius:8px; display:grid; place-items:center; cursor:pointer; font-size:15px; color:var(--ink2); user-select:none}
  .crow .qty i[disabled]{opacity:.3}
  .crow .qty b{font-size:15px; min-width:16px; text-align:center}
  .crow .cost{font-size:14px; font-weight:700; color:var(--primary); min-width:44px; text-align:center}
  .ctotal{display:flex; justify-content:space-between; align-items:baseline; padding:14px 2px 4px; font-size:14px}
  .ctotal b{font-size:24px; color:var(--gold); font-weight:700}
  .cnote{font-size:11px; color:var(--ink3); line-height:1.8; margin:4px 0 10px}
  /* 清单顶部「清空」+ 余额不足提示条（2026-10-28） */
  .sheet .shead{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .sheet .shead h3{margin:0}
  .clrbtn{flex-shrink:0; border:1px solid var(--border); background:transparent; color:var(--ink3); font-size:12px; font-weight:600; padding:7px 13px; min-height:32px; border-radius:9px; cursor:pointer; font-family:inherit; white-space:nowrap}
  .clrbtn:active{background:var(--bg)}
  .clrbtn.arm{border-color:var(--primary); color:var(--primary)}
  .cwarn{display:none; margin:10px 0 0; padding:10px 12px; border-radius:11px; background:rgba(166,58,43,.07); border:1px solid rgba(166,58,43,.26); color:var(--primary); font-size:12.5px; line-height:1.75}
  .cwarn b{font-weight:700}
  .cwarn .wt{display:block; font-weight:700; margin-bottom:2px}
  .cwarn.show{display:block}
  .cwarn.shake{animation:cwarnShake .34s ease}
  @keyframes cwarnShake{
    0%, 100%{transform:translateX(0)}
    22%{transform:translateX(-5px)}
    62%{transform:translateX(5px)}
  }
  .btn2{display:block; width:100%; padding:14px; border:0; border-radius:12px; background:var(--primary); color:#fff; font-size:16px; font-weight:600; letter-spacing:4px; cursor:pointer; min-height:50px; font-family:inherit}
  .btn2:active{transform:scale(.98)}
  .btn2[disabled]{opacity:.45; letter-spacing:2px}
  .ghost{display:block; width:100%; margin-top:9px; padding:11px; border:1px solid var(--border); border-radius:12px; background:transparent; color:var(--ink2); font-size:14px; cursor:pointer; font-family:inherit}
  /* 二维码屏 */
  #qrpage{position:fixed; inset:0; background:var(--bg); z-index:70; display:none; overflow-y:auto}
  #qrpage .inner{max-width:460px; margin:0 auto; padding:26px 18px 40px; text-align:center}
  #qrpage h2{font-size:18px; margin:0 0 4px}
  #qrpage .qs{font-size:12.5px; color:var(--ink3); margin:0}
  .qrbox{width:248px; height:248px; margin:20px auto 8px; background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:12px; box-shadow:0 4px 18px rgba(43,43,51,.06)}
  .qrbox img{width:100%; height:100%; display:block}
  .qr-exp{font-size:12px; color:var(--down); margin-bottom:10px}
  .qr-meta{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; text-align:left; font-size:13px; margin:8px 0 14px}
  .qr-meta .r{display:flex; justify-content:space-between; padding:3px 0}
  .qr-meta .r b{font-weight:600}
  .qr-code{font-family:Consolas,monospace; font-size:11px; color:var(--ink3); word-break:break-all; background:var(--card); border:1px dashed var(--border); border-radius:9px; padding:9px 11px; text-align:left; margin-bottom:14px; user-select:all}
  .foot{text-align:center; font-size:11.5px; color:var(--ink3); margin-top:26px; line-height:1.9}
  .foot a{color:var(--ink3)}
  .hidden{display:none !important}
  .spinner{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none} }
  /* 自助领取：学号 + 姓名 → 生成自己的二维码（2026-10-28 新增，学生端独立功能） */
  #claimCard{margin-top:2px}
  .cl-title{font-size:14.5px;font-weight:600;margin:0 0 5px;color:var(--ink)}
  .cl-sub{font-size:12.5px;color:var(--ink3);line-height:1.75;margin:0 0 15px}
  #claimOut{margin-top:14px;display:none}
  .cl-box{border:1px solid var(--border);border-radius:14px;padding:16px 14px 14px;background:var(--bg);text-align:center}
  .cl-who{font-size:14px;color:var(--ink2);margin-bottom:11px}
  .cl-who b{color:var(--ink);font-weight:600}
  .cl-qr{width:250px;height:250px;display:block;margin:0 auto;border-radius:8px;image-rendering:pixelated;background:#fff}
  .cl-code{font-family:Consolas,monospace;font-size:16px;font-weight:700;letter-spacing:1.5px;color:var(--primary);margin:11px 0 0}
  .cl-tip{font-size:12px;color:var(--ink3);line-height:1.85;margin-top:9px}
  .cl-act{display:flex;gap:9px;margin-top:14px}
  .cl-act button{flex:1;padding:11px;font-size:13.5px;font-weight:600;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-family:inherit;cursor:pointer}
  .cl-act button.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
  .cl-act button:active{opacity:.8}
  .msg.ok{background:rgba(47,125,91,.08); color:var(--up); border:1px solid rgba(47,125,91,.2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1 id="clsName">学分查询</h1>
    <p>输入学号和查询码，查看自己的学分与流水</p>
  </div>

  <div class="card" id="formCard">
    <div id="rmBanner"></div>
    <div class="field">
      <label for="sidInput">学号</label>
      <input id="sidInput" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
             spellcheck="false" placeholder="例如 S0001">
    </div>
    <div class="field">
      <label for="codeInput">查询码（8 位，可含横线）</label>
      <input id="codeInput" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
             spellcheck="false" maxlength="9" placeholder="ABCD-EFGH">
    </div>
    <label class="rmrow"><input type="checkbox" id="rmChk"> <span>记住我：在这台设备上保存，下次免输入（<b>公共设备请勿勾选</b>）</span></label>
    <button class="go" id="goBtn">查询</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="result"></div>

    <div class="card" id="claimCard">
    <div class="cl-title">还没存二维码？</div>
    <div class="cl-sub">输学号和姓名，生成属于你自己的查询二维码。长按图片存进相册，以后打开相册扫一扫就能看学分，不用再记查询码。</div>
    <div class="field">
      <label for="cSid">学号</label>
      <input id="cSid" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="例如 2602001">
    </div>
    <div class="field">
      <label for="cName">姓名</label>
      <input id="cName" type="text" autocomplete="off" spellcheck="false" placeholder="例如 张三">
    </div>
    <button class="go" id="claimBtn" onclick="doClaim()">生成我的二维码</button>
    <div class="msg" id="claimMsg"></div>
    <div id="claimOut"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<!-- 购物车浮条 / 清单抽屉 / 二维码屏（v3.7.1 自助兑换申请） -->
<div class="cartbar" id="cartbar" onclick="openCart()">
  <div class="ci" id="cartinfo"></div>
  <button id="cartgo" onclick="openCart()">去结算</button>
</div>
<div class="sheetmask" id="sheetmask" onclick="closeCart()"></div>
<div class="sheet" id="sheet">
  <div class="shead">
    <h3>🛒 兑换清单</h3>
    <button class="clrbtn" id="clrbtn" onclick="clearCart()">清空</button>
  </div>
  <div class="sub">实际兑换以班主任核销时的最新数据为准</div>
  <div id="cartrows"></div>
  <div class="ctotal"><span>合计</span><span><b id="carttotal">0</b> 币</span></div>
  <div class="cwarn" id="cartwarn"></div>
  <div class="cnote">生成后请在 3 天内出示给班主任扫码核销；逾期自动作废，可重新生成。二维码为一次性凭据，核销后即失效。</div>
  <button class="btn2" id="makqr" onclick="makeQr()">生成兑换二维码</button>
  <button class="ghost" onclick="closeCart()">继续逛逛</button>
</div>
<div id="qrpage">
  <div class="inner">
    <h2>兑换码已生成</h2>
    <p class="qs">出示本页给班主任 · 扫码即完成核销</p>
    <div class="qrbox" id="qrbox"></div>
    <div class="qr-exp">有效期剩余 <b id="qrtimer">--</b>（3 天内有效 · 过期作废可重新生成）</div>
    <div class="qr-meta">
      <div class="r"><span>学生</span><b id="qrstu">-</b></div>
      <div class="r"><span>合计</span><b id="qrtotal2">0 币</b></div>
      <div class="r"><span>清单</span><b id="qritems">-</b></div>
    </div>
    <div class="qr-code" id="qrcodetext">-</div>
    <button class="btn2" onclick="qrDone()">已完成 · 返回</button>
    <div class="foot">二维码为一次性凭据 · 核销后即失效<br>凭据由你的查询码签名，他人无法伪造</div>
  </div>
</div>

<!-- QR 生成器：同仓自带（MIT, kazuhikoarase/qrcode-generator），零外部 CDN -->
<script src="qrcode.js"></script>
<script src="qrcode_utf8.js"></script>
<script>
(function(){
  'use strict';

  /* ==================== 与 ../index.html 必须一致的常量 ====================
     ⚠️ 改这里必须同步改老师端，否则全班解不开。守卫 _v370_test.js 会比对两端字面量。 */
  var PBKDF2_ROUNDS = 30000;   // v3.7.9 60k→30k：手机派生≈1.5-2s；安全账：32^8≈1.1e12 @30k 全空间约 2.6 年（均摊 1.3 年/人）
  var CODE_LEN = 8;
  var ALG_LABEL = 'PBKDF2-SHA256(30000)/AES-GCM-256';

  var FAIL_KEY = 'cm_portal_fail';
  var FAIL_MAX = 5;
  var FAIL_LOCK_MS = 60000;
  var CACHE_KEY = 'cm_portal_cache';
  var CACHE_TTL_MS = 30 * 60 * 1000;   // v3.7.8 10→30 分钟：上课扫码全程走缓存（页脚「数据截至」可见发布时点；改轮数时代次校验会自动作废旧包）
  var RM_KEY = 'cm_portal_remember';   // v3.7.6 记住我（仅存本机，明文学号+码；公共设备不勾不存）
  /* v3.7.1 兑换凭据（与老师端 index.html 的 PORTAL_REDEEM_* 同步，守卫 _v371 比对） */
  var REDEEM_VER = 'CM1';
  var REDEEM_WINDOW_MS = 3 * 24 * 60 * 60 * 1000;   // v3.8.1 10 分钟→3 天（与老师端同步）

  var $ = function(id){ return document.getElementById(id); };

  function qsp(k){
    var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }
  var OWNER = qsp('o');
  var GIST = qsp('g');
  /* v3.7.6 二维码卡直达参数（&s=学号&c=查询码）：自动填充并直接查询 */
  var PSID = qsp('s');
  var PCODE = qsp('c');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function normCode(s){
    return String(s == null ? '' : s).toUpperCase().replace(/[^0-9A-Z]/g, '');
  }
  function b64dec(str){
    var bin = atob(String(str || '')), b = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return b;
  }
  function b64enc(buf){
    var s = '';
    new Uint8Array(buf).forEach(function(x){ s += String.fromCharCode(x); });
    return btoa(s);
  }
  function hasCrypto(){
    return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.deriveKey);
  }
  function msg(text, kind){
    var el = $('msg');
    el.className = 'msg show ' + (kind || 'err');
    el.innerHTML = text;
    el.style.display = 'block';
  }
  function hideMsg(){ $('msg').className = 'msg'; $('msg').style.display = 'none'; }

  /* ---------- 软限速：只抬成本，不承诺防御（前端限速清缓存即可绕过） ---------- */
  function failState(){
    try{
      var raw = localStorage.getItem(FAIL_KEY);
      if(!raw) return { n:0, at:0 };
      var o = JSON.parse(raw);
      if(!o || typeof o.n !== 'number') return { n:0, at:0 };
      if(Date.now() - (o.at || 0) > FAIL_LOCK_MS) return { n:0, at:0 };   // 过窗口自动清零
      return o;
    }catch(e){ return { n:0, at:0 }; }
  }
  function bumpFail(){
    var s = failState();
    s.n = (s.n || 0) + 1;
    s.at = Date.now();
    try{ localStorage.setItem(FAIL_KEY, JSON.stringify(s)); }catch(e){}
    return s;
  }
  function clearFail(){
    try{ localStorage.removeItem(FAIL_KEY); }catch(e){}
  }

  /* v3.7.7 超时保护：手机弱网/CDN 慢时不再无限转圈（25s 后中止并报可读错误）
     2026-10-28 提升到闭包顶层：查询包与「自助领取」两处网络路径共用同一实现，
     避免各自造 AbortController 而绕过统一超时（_v377 ① 会抓裸 fetch）。 */
  function fetchWithTimeout(url, ms){
    if(typeof AbortController === 'undefined') return fetch(url, { cache:'no-store' });
    var ctl = new AbortController();
    var timer = setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, ms || 25000);
    return fetch(url, { cache:'no-store', signal: ctl.signal }).finally(function(){ clearTimeout(timer); });
  }

  /* ---------- 拉发布包：CDN 优先，失败退 API ---------- */
  function fetchPayload(){
    var now = Date.now();
    try{
      var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if(c && c.owner === OWNER && c.gist === GIST && (now - (c.at || 0)) < CACHE_TTL_MS && c.payload &&
         (!c.payload.alg || c.payload.alg === ALG_LABEL)){   // v3.7.8 算法代次不匹配的旧缓存包作废重拉
        return Promise.resolve(c.payload);
      }
    }catch(e){}

    var tryFetch = function(url){
      return fetchWithTimeout(url).then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function(t){
        var p = JSON.parse(t);
        if(!p || !p.students) throw new Error('bad payload');
        try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ owner:OWNER, gist:GIST, at:now, payload:p })); }catch(e){}
        return p;
      });
    };

    var cdn = 'https://gist.githubusercontent.com/' + encodeURIComponent(OWNER) + '/' +
              encodeURIComponent(GIST) + '/raw/' + 'portal.json';
    return tryFetch(cdn).catch(function(){
      /* 备用：Gist API（匿名 60 次/小时，仅作兜底） */
      return fetchWithTimeout('https://api.github.com/gists/' + encodeURIComponent(GIST), 25000).then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function(j){
        var f = j.files && j.files['portal.json'];
        if(!f) throw new Error('no file');
        if(f.truncated){ throw new Error('truncated'); }
        return f.content ? JSON.parse(f.content)
          : fetchWithTimeout(f.raw_url).then(function(r){ return r.text(); }).then(JSON.parse);
      });
    });
  }

  /* ---------- 解密自己那一片 ---------- */
  /* v3.7.9 一次派生两用：PBKDF2 输出 512 位 → 前 32B 作 AES-GCM 解密钥、后 32B 作 HMAC 兑换签名钥。
     之前解密和出兑换码各跑一次完整派生（手机上各 1.5-2s）；现在扫码查询后出码零等待。
     AES 密钥材料与旧方案逐位一致（兼容已发布数据）；HMAC 材料换了位段 → 兑换凭据 10 分钟时效内自洽，无需兼容。 */
  var _keys = null;   // { code, saltB64, aesKey, hmacKey }（本页会话内复用）
  function deriveSessionKeys(code, salt){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(normCode(code)), 'PBKDF2', false, ['deriveBits'])
      .then(function(base){
        return crypto.subtle.deriveBits(
          { name:'PBKDF2', salt:salt, iterations:PBKDF2_ROUNDS, hash:'SHA-256' },
          base, 512
        );
      })
      .then(function(bits){
        return Promise.all([
          crypto.subtle.importKey('raw', new Uint8Array(bits, 0, 32), { name:'AES-GCM' }, false, ['decrypt']),
          crypto.subtle.importKey('raw', new Uint8Array(bits, 32, 32), { name:'HMAC', hash:'SHA-256' }, false, ['sign'])
        ]);
      })
      .then(function(keys){ return { aesKey: keys[0], hmacKey: keys[1] }; });
  }
  function openBlock(blk, code){
    var nc = normCode(code);
    var ready = (_keys && _keys.code === nc && _keys.saltB64 === blk.salt)
      ? Promise.resolve(_keys)
      : deriveSessionKeys(code, b64dec(blk.salt)).then(function(k){
          _keys = { code: nc, saltB64: blk.salt, aesKey: k.aesKey, hmacKey: k.hmacKey };
          return k;
        });
    return ready.then(function(k){
      return crypto.subtle.decrypt({ name:'AES-GCM', iv:b64dec(blk.iv) }, k.aesKey, b64dec(blk.data));
    }).then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
  }
  function redeemCanonical(o){
    return REDEEM_VER + '|' + o.sid + '|' +
      o.items.map(function(x){ return x[0] + ':' + x[1]; }).join(',') + '|' +
      o.total + '|' + o.ts + '|' + o.nonce;
  }

  /* ---------- 渲染 ---------- */
  function fmtTime(ts){
    var d = new Date(ts), n = new Date();
    var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    var sameDay = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
    var y = new Date(n.getTime() - 86400000);
    var isYd = d.getFullYear() === y.getFullYear() && d.getMonth() === y.getMonth() && d.getDate() === y.getDate();
    if(sameDay) return '今天 ' + hm;
    if(isYd) return '昨天 ' + hm;
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
  }
  function dayKey(ts){
    var d = new Date(ts), n = new Date();
    var sameDay = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
    if(sameDay) return '今天';
    var y = new Date(n.getTime() - 86400000);
    if(d.getFullYear() === y.getFullYear() && d.getMonth() === y.getMonth() && d.getDate() === y.getDate()) return '昨天';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function signed(n){
    var v = Number(n) || 0;
    return (v > 0 ? '+' : (v < 0 ? '−' : '')) + Math.abs(v);
  }
  function trendCls(n){ var v = Number(n) || 0; return v > 0 ? 'up' : (v < 0 ? 'down' : 'flat'); }

  /* v3.7.1 流水筛选（客户端按时间阈值）：最近 8 条 / 本周（周一起）/ 本月 / 全部 */
  function weekStartTs(){
    var d = new Date();
    var dow = d.getDay();
    var back = (dow === 0) ? 6 : (dow - 1);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() - back).getTime();
  }
  function monthStartTs(){
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  }
  var _data = null, _blkSalt = '', _curOpsFilter = 'recent', _curCat = '';
  function opsFilters(ops){
    var wk = weekStartTs(), mo = monthStartTs();
    return [
      { k:'recent', label:'最近', list:ops.slice(0, 8) },
      { k:'week',   label:'本周', list:ops.filter(function(o){ return o.time >= wk; }) },
      { k:'month',  label:'本月', list:ops.filter(function(o){ return o.time >= mo; }) },
      { k:'all',    label:'全部', list:ops.slice() }
    ];
  }
  function renderOpsChips(ops){
    var fs = opsFilters(ops);
    $('opChips').innerHTML = fs.map(function(f){
      return '<span class="chip' + (_curOpsFilter === f.k ? ' on' : '') + '" onclick="setOpsFilter(\'' + f.k + '\')">' +
             f.label + '<span class="n">' + f.list.length + '</span></span>';
    }).join('');
  }
  window.setOpsFilter = function(k){ _curOpsFilter = k; renderResult(); };
  window.setCat = function(c){ _curCat = c; renderResult(); };

  /* 购物车（v3.7.1） */
  var CART = {};
  function goodByKey(key){ return ((_data && _data.goods) || []).filter(function(g){ return g.key === key; })[0] || null; }
  function cartQty(key){ return CART[key] || 0; }
  function cartTotal(){ var t = 0; Object.keys(CART).forEach(function(k){ var g = goodByKey(k); if(g) t += g.cost * CART[k]; }); return t; }
  function cartCount(){ var n = 0; Object.keys(CART).forEach(function(k){ n += CART[k]; }); return n; }
  window.addToCart = function(key){
    if(!_data) return;   // v3.8.1 防御：查询未成功前不可操作
    var g = goodByKey(key);
    if(!g) return;
    if(g.remain - cartQty(key) <= 0) return;
    CART[key] = cartQty(key) + 1;
    renderResult();
  };
  window.chgQty = function(key, d){
    if(!_data) return;   // v3.8.1 防御同上
    var g = goodByKey(key), q = cartQty(key) + d;
    if(q <= 0) delete CART[key];
    else if(g && q <= g.remain) CART[key] = q;
    renderCartRows(); renderResult();
  };
  function renderCartBar(){
    var bar = $('cartbar'), n = cartCount(), t = cartTotal();
    if(!n || !_data){ bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    var lack = t > (Number(_data.coins) || 0);
    $('cartinfo').innerHTML = '🛒 已选 ' + n + ' 件 · 合计 <b>' + t + '</b> 币' +
      (lack ? '<span class="lack">币不足（还差 ' + (t - (Number(_data.coins) || 0)) + ' 币），请减少商品</span>' : '');
    /* 币不足时也必须能进清单（看提示 / 减商品 / 清空）；disabled 会吞掉点击、也不冒泡给浮条，
       与 v3.8.1「浮条整条可点」的本意冲突，这里改为换文案。 */
    $('cartgo').textContent = lack ? '去调整' : '去结算';
  }
  window.openCart = function(){
    if(!_data || !cartCount()) return;   // v3.8.1 浮条整条可点（含币不足时点开减商品）
    renderCartRows();
    $('sheetmask').style.display = 'block';
    $('sheet').style.display = 'block';
  };
  window.closeCart = function(){ $('sheetmask').style.display = 'none'; $('sheet').style.display = 'none'; };
  /* 余额不足提示 + 清空清单（2026-10-28）
     余额不足时绝不能再静默 return —— 学生点了「生成兑换二维码」必须当场看到原因。 */
  var _clrArmed = false, _clrTimer = null;
  function cartCoins(){ return Number(_data && _data.coins) || 0; }
  function cartLack(){ return cartTotal() - cartCoins(); }
  function resetClearArm(){
    _clrArmed = false;
    if(_clrTimer){ clearTimeout(_clrTimer); _clrTimer = null; }
    var b = $('clrbtn');
    if(b){ b.classList.remove('arm'); b.textContent = '清空'; }
  }
  window.clearCart = function(){
    if(!cartCount()){ resetClearArm(); return; }
    var b = $('clrbtn');
    if(!_clrArmed){
      /* 首点只进入待确认态，3 秒内再点才真清 —— 右上角按钮容易误触，清单丢了要重选一遍 */
      _clrArmed = true;
      if(b){ b.classList.add('arm'); b.textContent = '确认清空'; }
      if(_clrTimer) clearTimeout(_clrTimer);
      _clrTimer = setTimeout(resetClearArm, 3000);
      return;
    }
    resetClearArm();
    CART = {};
    renderCartRows();
    renderResult();
    closeCart();
  };
  function renderCartWarn(shake){
    var el = $('cartwarn');
    if(!el) return;
    var lack = cartLack();
    if(!_data || !cartCount() || lack <= 0){
      el.className = 'cwarn';
      el.innerHTML = '';
      return;
    }
    el.className = 'cwarn show';
    el.innerHTML = '<span class="wt">余额不足，无法兑换</span>' +
      '当前余额 ' + cartCoins() + ' 币，清单合计 ' + cartTotal() + ' 币，还差 <b>' + lack + '</b> 币。' +
      '请点清单里的「−」减少商品，或清空后重选。';
    if(shake){
      el.classList.remove('shake');
      void el.offsetWidth;          /* 强制回流，否则连点不会重放动画 */
      el.classList.add('shake');
    }
  }

  function renderCartRows(){
    $('cartrows').innerHTML = Object.keys(CART).map(function(k){
      var g = goodByKey(k);
      return '<div class="crow"><div class="cn"><b>' + esc(g.icon + ' ' + g.name) + '</b>' +
        '<span>' + g.cost + ' 币 · 本月余 ' + g.remain + '/' + g.limit + '</span></div>' +
        '<div class="qty"><i onclick="chgQty(\'' + k + '\',-1)">−</i><b>' + CART[k] + '</b>' +
        '<i onclick="chgQty(\'' + k + '\',1)"' + (CART[k] >= g.remain ? ' disabled' : '') + '>＋</i></div>' +
        '<div class="cost">' + (g.cost * CART[k]) + '</div></div>';
    }).join('');
    $('carttotal').textContent = cartTotal();
    renderCartWarn();
  }

  /* 兑换二维码（v3.7.1）：真二维码 + HMAC 签名凭据 + 10 分钟倒计时 */
  var _qrTimer = null;
  window.makeQr = function(){
    if(!_data || !cartCount()) return;
    var items = Object.keys(CART).map(function(k){ return [k, CART[k]]; });
    var total = cartTotal();
    if(total > cartCoins()){
      /* 余额不足：钉在清单里说清楚（原来这里裸 return，学生点了完全没反应） */
      renderCartWarn(true);
      try{ $('cartwarn').scrollIntoView({ behavior:'smooth', block:'center' }); }catch(e){}
      return;
    }
    var nonce = b64enc(crypto.getRandomValues(new Uint8Array(12)));
    if(!_keys || _keys.saltB64 !== _blkSalt){ alert('会话已过期，请返回重新查询'); return; }
    var o = { v: REDEEM_VER, sid: _data.sid, items: items, total: total, ts: Date.now(), nonce: nonce, salt: _blkSalt };
    var canon = redeemCanonical(o);
    Promise.resolve(_keys.hmacKey).then(function(key){
      return crypto.subtle.sign('HMAC', key, new TextEncoder().encode(canon));
    }).then(function(sig){
      o.sig = b64enc(sig);
      var json = JSON.stringify(o);
      var qr = window.qrcode(0, 'M');
      qr.addData(json, 'Byte');
      qr.make();
      $('qrbox').innerHTML = '<img alt="兑换二维码" src="' + qr.createDataURL(4, 8) + '">';
      $('qrstu').textContent = (_data.name || '') + ' · ' + _data.sid;
      $('qrtotal2').textContent = total + ' 币';
      $('qritems').textContent = items.map(function(x){ var g = goodByKey(x[0]); return (g ? g.name : x[0]) + '×' + x[1]; }).join('、');
      $('qrcodetext').textContent = json;
      closeCart();
      $('qrpage').style.display = 'block';
      try{ window.scrollTo(0, 0); }catch(e){}
      var endAt = Date.now() + REDEEM_WINDOW_MS;
      if(_qrTimer) clearInterval(_qrTimer);
      _qrTimer = setInterval(function(){
        var left = endAt - Date.now();
        if(left <= 0){
          clearInterval(_qrTimer); _qrTimer = null;
          $('qrtimer').textContent = '已过期';
          $('qrbox').innerHTML = '<div style="display:grid;place-items:center;height:100%;color:#B42318;font-size:14px;text-align:center;line-height:1.8">已过期<br>请返回重新生成</div>';
          return;
        }
        var d = Math.floor(left / 86400000);
        var h = Math.floor((left % 86400000) / 3600000);
        var m = Math.floor((left % 3600000) / 60000);
        var s = Math.floor((left % 60000) / 1000);
        $('qrtimer').textContent = d > 0 ? (d + ' 天 ' + h + ' 小时') : (('0' + h).slice(-2) + ':' + ('0' + m).slice(-2) + ':' + ('0' + s).slice(-2));
      }, 500);
    }).catch(function(e){
      alert('生成失败：' + (e && e.message ? e.message : e));
    });
  };
  window.qrDone = function(){
    if(_qrTimer){ clearInterval(_qrTimer); _qrTimer = null; }
    $('qrpage').style.display = 'none';
    CART = {};
    renderResult();
  };

  /* ---------- 结果渲染（含 v3.7.1 排名/筛选/商品） ---------- */
  function renderResult(){
    var data = _data;
    var h = '';
    h += '<div class="card hero">';
    h += '<div class="nm">' + esc(data.name || '') + '　<span style="color:var(--ink3);font-size:12.5px">' + esc(data.sid || '') + '</span></div>';
    h += '<div><span class="score">' + (Number(data.credit) || 0) + '</span><span class="unit">分</span></div>';
    if(data.level) h += '<div><span class="lv">' + esc(data.level) + '</span>';
    if(data.rank && data.total) h += '<span class="rankseal">第 ' + data.rank + ' 名 · 共 ' + data.total + ' 人</span>';
    if(data.level) h += '</div>';
    h += '<div class="trend">';
    h += '<div><span class="k">本周</span><span class="v ' + trendCls(data.weekNet) + '">' + signed(data.weekNet) + '</span></div>';
    h += '<div><span class="k">本月</span><span class="v ' + trendCls(data.monthNet) + '">' + signed(data.monthNet) + '</span></div>';
    h += '</div>';
    if(typeof data.coins === 'number'){
      h += '<div class="coin-line">学分币 <b>' + data.coins + '</b> 币 · 可在兑换商店使用</div>';
    }
    h += '</div>';

    var ops = data.ops || [];
    h += '<div class="sec-title">学分流水<span>' + (ops.length ? '本学期共 ' + ops.length + ' 条' : '') + '</span></div>';
    h += '<div class="chips" id="opChips"></div>';
    var fs = opsFilters(ops);
    var cur = fs.filter(function(f){ return f.k === _curOpsFilter; })[0] || fs[0];
    if(!cur.list.length){
      h += '<div class="empty">该时段暂无加减分记录</div>';
    } else {
      var plus = 0, minus = 0;
      cur.list.forEach(function(o){ var a = Number(o.amount) || 0; if(a > 0) plus += a; else minus += Math.abs(a); });
      h += '<div class="opsum"><span>共 ' + cur.list.length + ' 条</span><span>＋' + plus + ' / −' + minus + '</span></div>';
      var lastDay = '';
      cur.list.forEach(function(o){
        var dk = dayKey(o.time);
        if(dk !== lastDay){ h += '<div class="day">' + esc(dk) + '</div>'; lastDay = dk; }
        var amt = Number(o.amount) || 0;
        h += '<div class="row">' +
             '<span class="amt ' + (amt >= 0 ? 'up' : 'down') + '">' + signed(amt) + '</span>' +
             '<span class="rs">' + esc(o.reason || '（未填写原因）') + '</span>' +
             '<span class="tm">' + esc(fmtTime(o.time).replace(/^(今天|昨天) /, '')) + '</span>' +
             '</div>';
      });
    }

    var goods = data.goods || [];
    if(goods.length){
      h += '<div class="sec-title">可兑换商品<span>点 ＋ 加入兑换清单 · 一起结算</span></div>';
      var cats = [''].concat(Object.keys(goods.reduce(function(a, g){ a[g.cat || '其他'] = 1; return a; }, {})));
      h += '<div class="chips" id="catChips">' + cats.map(function(c){
        var n = c ? goods.filter(function(g){ return (g.cat || '其他') === c; }).length : goods.length;
        return '<span class="chip' + (_curCat === c ? ' on' : '') + '" onclick="setCat(\'' + esc(c) + '\')">' +
               (c || '全部') + '<span class="n">' + n + '</span></span>';
      }).join('') + '</div>';
      var list = _curCat ? goods.filter(function(g){ return (g.cat || '其他') === _curCat; }) : goods;
      h += '<div class="goods">' + list.map(function(g){
        var inCart = cartQty(g.key), dim = !g.remain;
        var canAdd = (g.remain - inCart) > 0;
        /* v3.8.1 已加购的卡片直接给 −/＋ 微调（不用进购物车也能改数量）；币不足时也能减 */
        var ctl;
        if(dim){
          ctl = '<button class="addbtn" disabled>已兑满</button>';
        } else if(inCart > 0){
          ctl = '<span class="cardqty"><i onclick="chgQty(\'' + esc(g.key) + '\',-1)">−</i><b>' + inCart + '</b>' +
                '<i onclick="chgQty(\'' + esc(g.key) + '\',1)"' + (canAdd ? '' : ' disabled') + '>＋</i></span>';
        } else {
          ctl = '<button class="addbtn" onclick="addToCart(\'' + esc(g.key) + '\')">＋ 加购</button>';
        }
        return '<div class="good' + (dim ? ' dim' : '') + '">' +
          (inCart ? '<span class="incart">清单×' + inCart + '</span>' : '') +
          '<span class="gi">' + esc(g.icon || '') + '</span><span class="gn">' + esc(g.name) + '</span>' +
          '<span class="gc">' + esc(g.cat || '') + ' · ' + (dim ? '本月已兑满' : '本月余 ' + g.remain + '/' + g.limit) + '</span>' +
          '<span class="gp"><b>' + g.cost + '</b> 币</span>' + ctl + '</div>';
      }).join('') + '</div>';
    }

    h += '<div class="foot" id="resultFoot"></div>';
    $('result').innerHTML = h;
    renderOpsChips(ops);
    var footAt = window.__pubMeta && window.__pubMeta.publishedAt ? new Date(window.__pubMeta.publishedAt) : null;
    var fh = '';
    if(footAt) fh += '数据截至 ' + footAt.getFullYear() + '年' + (footAt.getMonth() + 1) + '月' + footAt.getDate() +
                    '日 ' + ('0' + footAt.getHours()).slice(-2) + ':' + ('0' + footAt.getMinutes()).slice(-2) + '<br>';
    fh += '如与班主任记录不一致，请以班主任处为准<br>由班主任工作台生成';
    var rf = $('resultFoot'); if(rf) rf.innerHTML = fh;
    renderCartBar();
    try{ window.scrollTo(0, 0); }catch(e){}
  }

  function setBusy(busy){
    var b = $('goBtn');
    b.disabled = !!busy;
    b.innerHTML = busy ? '<span class="spinner"></span>查询中…' : '查询';
  }

  /* ---------- v3.7.6 记住我（仅本人设备） ---------- */
  function readRemember(){
    try{
      var r = JSON.parse(localStorage.getItem(RM_KEY) || 'null');
      return (r && r.sid && r.code) ? r : null;
    }catch(e){ return null; }
  }
  function saveRemember(sid, code){
    try{ localStorage.setItem(RM_KEY, JSON.stringify({ sid: sid, code: code, at: Date.now() })); }catch(e){}
  }
  function renderRememberBanner(){
    var b = $('rmBanner');
    if(!b) return;
    var r = readRemember();
    if(!r){ b.style.display = 'none'; return; }
    b.style.display = '';
    b.innerHTML = '本机已保存的查询：<b>' + esc(r.sid) + '</b>' +
      ' <span class="rmact" onclick="useRemember()">一键进入</span>' +
      ' <span class="rmact rmclear" onclick="forgetRemember()">清除</span>';
  }
  window.useRemember = function(){
    var r = readRemember();
    if(!r) return;
    $('sidInput').value = r.sid;
    var c = normCode(r.code);
    $('codeInput').value = c.length > 4 ? c.slice(0, 4) + '-' + c.slice(4) : c;
    submit();
  };
  window.forgetRemember = function(){
    try{ localStorage.removeItem(RM_KEY); }catch(e){}
    renderRememberBanner();
  };

  /* ---------- 主流程 ---------- */
  var payloadCache = null;
  function submit(){
    hideMsg();
    if(!hasCrypto()){
      msg('当前浏览器或打开方式不支持加密查询。<br>请用手机自带浏览器（Safari / Chrome）重新打开本链接，<b>不要</b>从微信内置浏览器或已过期的收藏页打开。');
      return;
    }
    if(!OWNER || !GIST){
      msg('链接不完整。<br>请使用班主任发的那条查询链接打开，不要手动输入网址。');
      return;
    }
    var sid = String($('sidInput').value || '').trim();
    var code = normCode($('codeInput').value);
    if(!sid){ msg('请填写学号。'); return; }
    if(code.length !== CODE_LEN){ msg('查询码应为 8 位（可含横线）。'); return; }

    var fs = failState();
    if(fs.n >= FAIL_MAX){
      var left = Math.ceil((FAIL_LOCK_MS - (Date.now() - fs.at)) / 1000);
      if(left > 0){ msg('输错次数过多，请 <b>' + left + '</b> 秒后再试。'); return; }
      clearFail();
    }

    setBusy(true);
    var getP = payloadCache ? Promise.resolve(payloadCache) : fetchPayload();
    getP.then(function(p){
      payloadCache = p;
      if(p.className){ $('clsName').textContent = p.className + ' · 学分查询'; }
      var blk = p.students && p.students[sid];
      if(!blk){
        setBusy(false);
        var s2 = bumpFail();
        msg('学号未找到，请核对后重试。<span style="font-size:12px">（学号以班主任发的查询卡为准，通常为 7 位数字如 2602001）</span>' + (s2.n >= FAIL_MAX ? '<br>已连续出错 ' + s2.n + ' 次，将暂时锁定。' : ''));
        return;
      }
      return openBlock(blk, code).then(function(data){
        clearFail();
        setBusy(false);
        payloadCache = null;          // 明文只在内存里活一次，渲染完即丢弃
        _data = data;                 // v3.7.1 兑换与筛选需要驻留（仅本页内存，不落盘）
        _blkSalt = blk.salt;
        window.__lastCode = code;
        window.__pubMeta = p;
        try{ if($('rmChk') && $('rmChk').checked) saveRemember(sid, code); }catch(e){}   // v3.7.6 记住我
        _curOpsFilter = 'recent'; _curCat = '';
        CART = {};
        $('formCard').classList.add('hidden');
        renderResult();
        $('foot').innerHTML = '<a href="javascript:location.reload()">切换学号重新查询</a>';
      });
    }).catch(function(e){
      setBusy(false);
      var m = String(e && e.message || e);
      var _ml = m.toLowerCase();   // v3.7.7 大小写不敏感——Chrome 解密失败抛 OperationError（大写 O），原小写匹配永远落空显示英文原始错误
      if(_ml.indexOf('decrypt') >= 0 || _ml.indexOf('operation') >= 0 || _ml.indexOf('dataerror') >= 0){
        var s3 = bumpFail();
        var rest = FAIL_MAX - s3.n;
        msg('查询码不正确。' + (rest > 0 ? '还可以试 ' + rest + ' 次。' : '已锁定 60 秒。') + '<span style="font-size:12px">（若班主任刚更新过系统，请先刷新页面再试）</span>');
      } else if(m.indexOf('HTTP 404') >= 0 || m.indexOf('bad payload') >= 0){
        msg('查询服务未开放。<br>可能班主任尚未发布，或已撤销。请联系班主任。');
      } else if(m.indexOf('TIMEOUT') >= 0 || m.indexOf('abort') >= 0 || m.indexOf('AbortError') >= 0){
        msg('网络较慢，数据包没能在 25 秒内下载完。<br>请移到信号好的地方稍后重试；多次失败请联系班主任。');
      } else if(m.indexOf('HTTP') >= 0){
        msg('网络异常（' + esc(m) + '）。请检查网络后重试。');
      } else {
        msg('查询失败：' + esc(m));
      }
    });
  }

  /* ---------- 初始化 ---------- */
  function init(){
    $('goBtn').addEventListener('click', submit);
    $('sidInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('codeInput').focus(); });
    $('codeInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
    /* 码输入框自动插横线并把小写转大写（纯显示层，提交前仍会归一化） */
    $('codeInput').addEventListener('input', function(){
      var el = this, raw = normCode(el.value).slice(0, CODE_LEN);
      el.value = raw.length > 4 ? raw.slice(0, 4) + '-' + raw.slice(4) : raw;
    });

    renderRememberBanner();
    if(PSID && PCODE){
      $('sidInput').value = String(PSID).trim();
      var _pc = normCode(PCODE);
      $('codeInput').value = _pc.length > 4 ? _pc.slice(0, 4) + '-' + _pc.slice(4) : _pc;
      setTimeout(submit, 150);   // 等首屏渲染一拍再查（fetchPayload 已在预取）
    }

    if(!OWNER || !GIST){
      msg('这个页面需要通过<b>班主任发来的链接</b>打开。<br>直接访问会缺少查询参数，无法定位你班级的数据。');
      return;
    }
    if(!hasCrypto()){
      msg('当前打开方式不支持加密查询，请用系统浏览器（Safari / Chrome）打开本链接。', 'warn');
    }
    /* 预取发布包：让学生输完码点查询时不用等网络 */
    fetchPayload().then(function(p){
      payloadCache = p;
      if(p.className) $('clsName').textContent = p.className + ' · 学分查询';
    }).catch(function(e){
      var m = String(e && e.message || e);
      if(m.indexOf('404') >= 0){
        msg('查询服务当前未开放（班主任未发布或已撤销）。');
      }
    });
  }
  /* ---------- 自助领取：学号 + 姓名 → 自己的二维码（2026-10-28 新增） ----------
     数据源 claim.json（与 portal.json 同一个 Gist）：每人一块 AES-GCM 密文，
     密钥 = PBKDF2-SHA256(学号 + '|' + 姓名)。Gist 里没有任何明文查询码。
     ⚠️ 安全边界（老板拍板）：钥匙是班里半公开信息，防"顺手翻看"，防不住"存心逐个试"。
        要收紧只改 claimMaterial() 的钥匙与 claimRounds 两处，改完重新发布 claim.json 即可。 */
  var CLAIM_FILE = 'claim.json';
  var CLAIM_ROUNDS_FALLBACK = 100000;
  var CLAIM_CACHE_KEY = 'cm_portal_claim_cache';
  var CLAIM_FAIL_KEY = 'cm_portal_claim_fail';
  var claimCache = null, _claimBusy = false, _lastClaim = null;

  function claimNormSid(s){ return String(s == null ? '' : s).toUpperCase().replace(/[^0-9A-Z]/g, ''); }
  function claimNormName(s){
    return String(s == null ? '' : s).replace(/[\s\u3000]+/g, '').replace(/[（(][^）)]*[）)]/g, '');
  }
  function claimMaterial(sid, name){ return claimNormSid(sid) + '|' + claimNormName(name); }
  function claimFmtCode(code){
    var c = normCode(code);
    return c.length > 4 ? c.slice(0, 4) + '-' + c.slice(4) : c;
  }
  function claimMsg(text, kind){
    var el = $('claimMsg');
    el.className = 'msg show ' + (kind || 'err');
    el.innerHTML = text;
    el.style.display = 'block';
  }
  function claimHideMsg(){ var el = $('claimMsg'); el.className = 'msg'; el.style.display = 'none'; }
  function claimFailState(){
    try{
      var raw = localStorage.getItem(CLAIM_FAIL_KEY);
      if(!raw) return { n:0, at:0 };
      var o = JSON.parse(raw);
      if(!o || typeof o.n !== 'number') return { n:0, at:0 };
      if(Date.now() - (o.at || 0) > FAIL_LOCK_MS) return { n:0, at:0 };
      return o;
    }catch(e){ return { n:0, at:0 }; }
  }
  function claimBumpFail(){
    var s = claimFailState();
    s.n = (s.n || 0) + 1; s.at = Date.now();
    try{ localStorage.setItem(CLAIM_FAIL_KEY, JSON.stringify(s)); }catch(e){}
    return s;
  }
  function claimClearFail(){ try{ localStorage.removeItem(CLAIM_FAIL_KEY); }catch(e){} }

  function fetchClaimPayload(){
    if(claimCache) return Promise.resolve(claimCache);
    try{
      var c = JSON.parse(localStorage.getItem(CLAIM_CACHE_KEY) || 'null');
      if(c && c.owner === OWNER && c.gist === GIST && (Date.now() - (c.at || 0)) < CACHE_TTL_MS && c.payload && c.payload.students){
        claimCache = c.payload;
        return Promise.resolve(claimCache);
      }
    }catch(e){}
    function grab(url, parse){ return fetchWithTimeout(url).then(parse); }
    function asJson(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text().then(JSON.parse); }
    var cdn = 'https://gist.githubusercontent.com/' + encodeURIComponent(OWNER) + '/' +
              encodeURIComponent(GIST) + '/raw/' + CLAIM_FILE;
    return grab(cdn, asJson).catch(function(){
      return grab('https://api.github.com/gists/' + encodeURIComponent(GIST), function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function(j){
        var f = j.files && j.files[CLAIM_FILE];
        if(!f) throw new Error('NOFILE');
        if(f.truncated) throw new Error('NOFILE');
        return f.content ? JSON.parse(f.content)
          : grab(f.raw_url, function(r){ return r.text().then(JSON.parse); });
      });
    }).then(function(p){
      if(!p || !p.students) throw new Error('NOFILE');
      claimCache = p;
      try{ localStorage.setItem(CLAIM_CACHE_KEY, JSON.stringify({ owner:OWNER, gist:GIST, at:Date.now(), payload:p })); }catch(e){}
      return p;
    });
  }

  function claimDerive(material, salt, rounds){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(material), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:salt, iterations:rounds, hash:'SHA-256' },
          base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      });
  }

  function claimTargetUrl(sid, code){
    var dir = location.pathname.replace(/[^/]*$/, '');
    return location.origin + dir +
      '?o=' + encodeURIComponent(OWNER) + '&g=' + encodeURIComponent(GIST) +
      '&s=' + encodeURIComponent(sid) + '&c=' + encodeURIComponent(normCode(code));
  }

  window.doClaim = function(){
    if(_claimBusy) return;
    var sid = claimNormSid($('cSid').value);
    var name = claimNormName($('cName').value);
    if(!sid){ claimMsg('请填写学号。'); return; }
    if(!name){ claimMsg('请填写姓名。'); return; }
    if(!OWNER || !GIST){ claimMsg('请通过班主任发来的链接打开本页。'); return; }
    if(!hasCrypto()){
      claimMsg('当前打开方式不支持加密，请用系统浏览器（Safari / Chrome）打开本链接。', 'warn');
      return;
    }
    var fs = claimFailState();
    if(fs.n >= FAIL_MAX){
      var left = Math.ceil((FAIL_LOCK_MS - (Date.now() - fs.at)) / 1000);
      if(left > 0){ claimMsg('试错次数过多，请 <b>' + left + '</b> 秒后再试。'); return; }
      claimClearFail();
    }
    _claimBusy = true;
    var btn = $('claimBtn');
    btn.disabled = true; btn.textContent = '正在生成…';
    $('claimOut').style.display = 'none';
    claimHideMsg();

    fetchClaimPayload().then(function(p){
      var blk = p.students && p.students[sid];
      if(!blk) throw new Error('NOMATCH');
      var rounds = p.rounds || CLAIM_ROUNDS_FALLBACK;
      return claimDerive(claimMaterial(sid, name), b64dec(blk.salt), rounds)
        .then(function(key){
          return crypto.subtle.decrypt({ name:'AES-GCM', iv:b64dec(blk.iv) }, key, b64dec(blk.data));
        })
        .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
    }).then(function(o){
      claimClearFail();
      renderClaim(o);
    }).catch(function(e){
      var m = String(e && e.message || e);
      if(m === 'NOMATCH' || (e && e.name === 'OperationError')){
        var s2 = claimBumpFail();
        claimMsg('学号和姓名对不上，请核对后再试。' +
          (s2.n >= FAIL_MAX ? '<br>已连续出错 ' + s2.n + ' 次，将暂时锁定。' : ''));
      } else if(m === 'NOFILE' || m.indexOf('404') >= 0){
        claimMsg('班主任还没开启「自助领取」。请先用纸质查询卡，或联系班主任。', 'warn');
      } else {
        claimMsg('生成失败：' + esc(m) + '<br>请检查网络后重试。');
      }
    }).finally(function(){
      _claimBusy = false;
      btn.disabled = false; btn.textContent = '生成我的二维码';
    });
  };

  function renderClaim(o){
    var sid = String(o.sid || '').trim();
    var code = normCode(o.code || '');
    var url = claimTargetUrl(sid, code);
    var qr = window.qrcode(0, 'M');
    qr.addData(url, 'Byte');
    qr.make();
    var dataUrl = qr.createDataURL(6, 10);
    var nm = claimNormName(o.name || '') || claimNormName($('cName').value);
    $('claimOut').innerHTML =
      '<div class="cl-box">' +
        '<div class="cl-who"><b>' + esc(nm) + '</b> · ' + esc(sid) + '</div>' +
        '<img class="cl-qr" alt="我的查询二维码" src="' + dataUrl + '">' +
        '<div class="cl-code">' + esc(claimFmtCode(code)) + '</div>' +
        '<div class="cl-tip">长按图片保存到相册 · 以后扫这张码直接看学分<br>也可以把这张图发给家长，家长扫码同样能看</div>' +
        '<div class="cl-act">' +
          '<button class="pri" onclick="claimGo()">直接查看</button>' +
          '<button onclick="claimSave()">保存图片</button>' +
        '</div>' +
      '</div>';
    $('claimOut').style.display = 'block';
    _lastClaim = { sid: sid, code: code, dataUrl: dataUrl, name: nm };
    try{ saveRemember(sid, code); }catch(e){}
    claimMsg('已生成，记得存图。', 'ok');
    try{ $('claimOut').scrollIntoView({ behavior:'smooth', block:'center' }); }catch(e){}
  }

  window.claimGo = function(){
    if(!_lastClaim) return;
    $('sidInput').value = _lastClaim.sid;
    $('codeInput').value = claimFmtCode(_lastClaim.code);
    try{ $('rmChk').checked = true; }catch(e){}
    try{ window.scrollTo({ top:0, behavior:'smooth' }); }catch(e){ window.scrollTo(0, 0); }
    setTimeout(submit, 260);
  };

  window.claimSave = function(){
    if(!_lastClaim) return;
    try{
      var a = document.createElement('a');
      a.href = _lastClaim.dataUrl;
      a.download = '查询二维码-' + _lastClaim.sid + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      claimMsg('已保存到下载目录。手机端如果没反应，直接长按图片保存。', 'ok');
    }catch(e){
      claimMsg('这个浏览器不支持直接保存，请长按图片保存到相册。', 'warn');
    }
  };

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
